services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
      POSTGRES_DB: riskdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d riskdb"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://risk:risk@db:5432/riskdb
      MODEL_DIR: models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
